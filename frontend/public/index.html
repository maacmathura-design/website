<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#101114" />
    <script>
      (function () {
        var theme;
        try {
          var stored = window.localStorage.getItem('maac-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (error) {}
        if (!theme) {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute('content', theme === 'light' ? '#f7f7f5' : '#101114');
      })();
    </script>
    <style>
      html[data-theme='dark'] { background-color: #101114; color-scheme: dark; }
      html[data-theme='light'] { background-color: #f7f7f5; color-scheme: light; }
    </style>
